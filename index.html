<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍫 巧克力英文練習</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff4e6,#f7dfc8);color:#3d2618;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:min(760px,100%);background:#fffaf5;border:3px solid #6b3f25;border-radius:28px;padding:28px;box-shadow:0 18px 50px #6b3f2525}
h1{text-align:center;margin:0 0 8px;font-size:34px}.sub{text-align:center;color:#7a5a47;margin-bottom:24px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}.stat{background:#f2dfcc;border-radius:14px;padding:9px 15px;font-weight:700}
.question{background:#4b2b1c;color:white;border-radius:22px;padding:30px;text-align:center;margin-bottom:18px}
.question small{opacity:.8}.word{font-size:48px;font-weight:900;margin-top:8px}
input{width:100%;font-size:24px;padding:17px;border:3px solid #c79d7b;border-radius:16px;outline:none;text-align:center;color:#3d2618;background:white}
input:focus{border-color:#6b3f25;box-shadow:0 0 0 4px #6b3f2515}
button{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:800;cursor:pointer}
.primary{width:100%;margin-top:12px;background:#6b3f25;color:white}.secondary{background:#ead1bb;color:#4b2b1c}
.feedback{min-height:34px;text-align:center;font-size:20px;font-weight:800;margin:14px 0}
.correct{color:#2e7d32}.wrong{color:#b3261e}
.controls{display:flex;gap:10px;margin-top:10px}.controls button{flex:1}
.hint{text-align:center;color:#8a6b58;font-size:14px;margin-top:18px}
kbd{background:#eee0d3;border:1px solid #c8ad98;border-bottom-width:3px;border-radius:6px;padding:2px 6px}
</style>
</head>
<body>
<main class="app">
<h1>🍫 巧克力英文練習</h1>
<div class="sub">把中文翻譯成英文，邊打字邊享受「ㄆㄧㄚˉㄆㄧㄚˉ」！</div>
<div class="stats">
  <div class="stat">題目 <span id="num">1</span>/<span id="total">20</span></div>
  <div class="stat">答對 <span id="score">0</span></div>
  <div class="stat">連續 <span id="streak">0</span> 🔥</div>
  <div class="stat">正確率 <span id="accuracy">0%</span></div>
</div>
<section class="question">
  <small>請翻譯成英文</small>
  <div class="word" id="word">你好</div>
</section>
<input id="answer" autocomplete="off" spellcheck="false" placeholder="輸入英文..." autofocus>
<button class="primary" id="submit">確認答案 ↵</button>
<div class="feedback" id="feedback"></div>
<div class="controls">
  <button class="secondary" id="skip">跳過</button>
  <button class="secondary" id="restart">重新開始</button>
</div>
<div class="hint">提示：按 <kbd>Enter</kbd> 可以直接送出答案。</div>
</main>

<script>
const bank=[
["你好",["hello","hi"]],
["謝謝",["thank you","thanks"]],
["早安",["good morning"]],
["晚安",["good night"]],
["再見",["goodbye","bye"]],
["請",["please"]],
["對不起",["sorry"]],
["沒關係",["it's okay","its okay","no problem"]],
["是",["yes"]],
["不是",["no"]],
["朋友",["friend"]],
["家人",["family"]],
["學校",["school"]],
["老師",["teacher"]],
["學生",["student"]],
["書",["book"]],
["筆",["pen"]],
["水",["water"]],
["食物",["food"]],
["蘋果",["apple"]],
["香蕉",["banana"]],
["貓",["cat"]],
["狗",["dog"]],
["鳥",["bird"]],
["房子",["house","home"]],
["房間",["room"]],
["桌子",["table"]],
["椅子",["chair"]],
["電腦",["computer"]],
["手機",["phone","cell phone","mobile phone"]],
["快樂",["happy"]],
["難過",["sad"]],
["生氣",["angry"]],
["大",["big","large"]],
["小",["small"]],
["漂亮的",["beautiful","pretty"]],
["好吃的",["delicious","tasty"]],
["跑",["run"]],
["走",["walk"]],
["吃",["eat"]],
["喝",["drink"]],
["睡覺",["sleep"]],
["讀",["read"]],
["寫",["write"]],
["玩",["play"]],
["喜歡",["like"]],
["愛",["love"]],
["幫助",["help"]],
["學習",["learn","study"]],
["今天",["today"]],
["明天",["tomorrow"]],
["昨天",["yesterday"]]
];

let questions=[], index=0, score=0, attempts=0, streak=0, locked=false;
const $=id=>document.getElementById(id);
$("total").textContent=20;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function normalize(s){return s.toLowerCase().trim().replace(/[.,!?'"“”‘’]/g,"").replace(/\s+/g," ")}
function makeRound(){
  questions=shuffle(bank).slice(0,20);
  index=score=attempts=streak=0; locked=false;
  $("feedback").textContent="";
  show();
}
function show(){
  $("num").textContent=index+1;
  $("word").textContent=questions[index][0];
  $("answer").value="";
  $("answer").disabled=false;
  $("answer").focus();
  updateStats();
}
function updateStats(){
  $("score").textContent=score;
  $("streak").textContent=streak;
  $("accuracy").textContent=(attempts?Math.round(score/attempts*100):0)+"%";
}
function next(){
  index++;
  if(index>=questions.length){
    $("word").textContent="🎉 完成！";
    $("feedback").innerHTML=`本輪答對 <b>${score}</b> / ${questions.length} 題，正確率 <b>${Math.round(score/questions.length*100)}%</b>`;
    $("answer").disabled=true; locked=true; updateStats(); return;
  }
  locked=false; show();
}
function submit(){
  if(locked)return;
  const value=normalize($("answer").value);
  if(!value){$("feedback").textContent="請先輸入答案！";return}
  attempts++;
  const answers=questions[index][1].map(normalize);
  if(answers.includes(value)){
    score++; streak++;
    $("feedback").className="feedback correct";
    $("feedback").textContent="✅ 答對了！";
    locked=true;
    updateStats();
    setTimeout(next,650);
  }else{
    streak=0;
    $("feedback").className="feedback wrong";
    $("feedback").textContent="❌ 再試一次！";
    updateStats();
  }
}

$("submit").onclick=submit;
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
$("restart").onclick=makeRound;
$("skip").onclick=()=>{if(!locked){$("feedback").className="feedback wrong";$("feedback").textContent="➡️ 跳過，答案："+questions[index][1][0];locked=true;setTimeout(next,900)}};

// 巧克力鍵盤音效：用 Web Audio 即時合成，不需要外部音檔。
let audioCtx=null;
function keySound(){
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(115,t);
    o.frequency.exponentialRampToValueAtTime(72,t+.055);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.055,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+.065);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+.07);
  }catch(e){}
}
$("answer").addEventListener("keydown",e=>{
  if(e.key.length===1 || e.key==="Backspace" || e.key==="Spacebar") keySound();
});
makeRound();
</script>
</body>
</html>
